name: Compilar Jogo PS3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Compilar jogo para PS3 (.pkg)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project ghcr.io/ps3dev/ps3toolchain:latest make pkg

      - name: Disponibilizar arquivo .pkg para download
        uses: actions/upload-artifact@v4
        with:
          name: slither-ps3-pkg
          path: "**/*.pkg"
          if-no-files-found: warn
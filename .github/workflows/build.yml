name: Compilar Jogo PS3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl python3 pkg-config autoconf automake libtool libtool-bin texinfo libgmp-dev libmpfr-dev libmpc-dev libssl-dev zlib1g-dev libncurses-dev libelf-dev libreadline-dev flex bison m4 gettext libglib2.0-dev

      - name: Baixar e compilar toolchain PS3
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          echo "PS3DEV=$PS3DEV" >> $GITHUB_ENV
          echo "PSL1GHT=$PSL1GHT" >> $GITHUB_ENV
          echo "PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin" >> $GITHUB_ENV
          sudo mkdir -p $PS3DEV
          sudo chown -R $USER $PS3DEV
          cd /tmp
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Compilar jogo para PS3 (.pkg)
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PS3DEV/portlibs/ppu/bin
          make pkg
          ls -R
          find . -name "*.pkg"

      - name: Disponibilizar arquivo .pkg para download
        uses: actions/upload-artifact@v4
        with:
          name: slither-ps3-pkg
          path: "**/*.pkg"
          if-no-files-found: warn